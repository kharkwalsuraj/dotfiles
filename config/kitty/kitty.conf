# Font
font_family IBM Plex Mono
font_size 12

# Cursor
cursor_shape beam
cursor_blink_interval 0
cursor_trail 1

# Scrollback
scrollback_lines 10000
scrollbar scrolled
scrollbar_interactive yes
# Pages the scrollback through Neovim; the Lua side lives in nvim/lua/editor/scrollback.lua
scrollback_pager nvim -u NONE -R -M -c 'lua require("editor.scrollback")(INPUT_LINE_NUMBER, CURSOR_LINE, CURSOR_COLUMN)' -

# Window
window_padding_width 0
# Outer margin around the whole layout
window_margin_width 12
window_border_width 1pt
draw_minimal_borders yes
inactive_text_alpha 0.7
hide_window_decorations yes
confirm_os_window_close 0
enabled_layouts tall,vertical,horizontal,stack

# Tabs
tab_bar_style hidden

# Behavior
shell fish
show_hyperlink_targets yes
strip_trailing_spaces smart
enable_audio_bell no
visual_bell_duration 0

# Keybinds
map ctrl+c copy_or_interrupt
map ctrl+shift+h show_scrollback
map page_up scroll_page_up
map page_down scroll_page_down
map alt+] next_tab
map alt+[ previous_tab
map ctrl+kp_add change_font_size all +1
map ctrl+kp_subtract change_font_size all -1
map ctrl+kp_0 change_font_size all 0
map ctrl+shift+m select_tab

# Theme (overwritten by hyprland-shell scripts)
include themes/Colors.conf
