[config]
version_check = false
prefer = "saturation"


[config.wallpaper]
set = true
command = '''
image="{{ image }}"
cache_dir="$HOME/.cache/niri/backdrop-wallpapers"
mkdir -p "$cache_dir"

name="$(basename "$image")"
cache="$cache_dir/${name%.*}.webp"

if [ ! -f "$cache" ]; then
    magick "$image" -resize "1280x1280>" -strip -blur "0x16" -quality 80 "$cache"
fi

awww img --transition-type fade --transition-duration 0.5 -n backdrop "$cache" &
awww img --transition-type fade --transition-duration 0.5 "$image" &
'''


[templates.ansi]
input_path = '~/.config/matugen/templates/ansi/colors.json'
output_path = '~/.local/state/matugen/colors.json'
post_hook = '''
python3 ~/.config/matugen/templates/ansi/ansi.py --blend_bg_fg --mode "{{ mode }}" --scheme "{{ scheme }}"

python3 ~/.config/matugen/templates/ansi/scripts/nvim.py --mode "{{ mode }}" &
python3 ~/.config/matugen/templates/ansi/scripts/kitty.py &
python3 ~/.config/matugen/templates/ansi/scripts/fzf.py &
'''


[templates.niri]
input_path = '~/.config/matugen/templates/niri/colors.kdl'
output_path = '~/.config/niri/modules/colors.kdl'
post_hook = 'niri msg action load-config-file'


[templates.gtk3]
input_path = '~/.config/matugen/templates/gtk-3.0/gtk.css'
output_path = '~/.config/gtk-3.0/gtk.css'
post_hook = '''
gsettings set org.gnome.desktop.interface gtk-theme ""

if [ "{{ mode }}" = "light" ]; then
    gsettings set org.gnome.desktop.interface gtk-theme "adw-gtk3"
    gsettings set org.gnome.desktop.interface icon-theme "Colloid"
else
    gsettings set org.gnome.desktop.interface gtk-theme "adw-gtk3-dark"
    gsettings set org.gnome.desktop.interface icon-theme "Colloid-Dark"
fi
'''


[templates.gtk4]
input_path = '~/.config/matugen/templates/gtk-4.0/gtk.css'
output_path = '~/.config/gtk-4.0/gtk.css'
post_hook = '''
if [[ "{{ mode }}" == "light" ]]; then
    gsettings set org.gnome.desktop.interface color-scheme prefer-dark
    gsettings set org.gnome.desktop.interface color-scheme prefer-light
else
    gsettings set org.gnome.desktop.interface color-scheme prefer-light
    gsettings set org.gnome.desktop.interface color-scheme prefer-dark
fi
'''


[templates.qt]
input_path = '~/.config/matugen/templates/qt/Matugen.colors'
output_path = '~/.local/share/color-schemes/Matugen.colors'
post_hook = '''
config="$HOME/.config/qt6ct/qt6ct.conf"
scheme="$HOME/.local/share/color-schemes/Matugen.colors"

if [ "{{ mode }}" = "light" ]; then
    kwriteconfig6 --file qt6ct/qt6ct.conf --group Appearance --key icon_theme Colloid
else
    kwriteconfig6 --file qt6ct/qt6ct.conf --group Appearance --key icon_theme Colloid-Dark
fi

mkdir -p "$(dirname "$config")" "$(dirname "$scheme")"

kwriteconfig6 --file qt6ct/qt6ct.conf --group Appearance --key color_scheme_path ~/.local/share/color-schemes/Matugen.colors
kwriteconfig6 --file qt6ct/qt6ct.conf --group Appearance --key custom_palette true
kwriteconfig6 --file qt6ct/qt6ct.conf --group Appearance --key style Darkly
'''
