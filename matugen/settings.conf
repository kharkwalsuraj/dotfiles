# GTK appearance
gtk_theme_light="adw-gtk3"
gtk_theme_dark="adw-gtk3-dark"
gtk_icon_theme_light="Colloid"
gtk_icon_theme_dark="Colloid-Dark"

# Qt appearance
qt_icon_theme_light="Colloid"
qt_icon_theme_dark="Colloid-Dark"

# Theme controls
enable_gtk_theming=true
enable_qt_theming=false # isntall darkly-bin  for styles

# Backdrop wallpaper
enable_backdrop_wallpaper=false
backdrop_blur_radius=16
backdrop_resize_geometry="1280x1280>"
backdrop_quality=40
